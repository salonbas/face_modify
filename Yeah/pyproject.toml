[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversarial-robustness-face-analysis"
version = "0.3.0"
description = "InsightFace white-box adversarial robustness experiments"
readme = "README.md"
requires-python = ">=3.10"
# Runtime deps are pinned in requirements.txt (install with pip install -r requirements.txt).
# Keep this list empty to avoid conflicting pins with torch/onnx wheels.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["advface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
